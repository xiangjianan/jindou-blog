<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - 页面不存在</title>
<style>
:root{--color-bg:#f5f5f5;--color-primary:#6c5ce7;--color-text:#2d3436;--color-text-secondary:#636e72}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--color-bg);color:var(--color-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.6}
.card{text-align:center;padding:3rem 2rem}
.code{font-size:5rem;font-weight:700;color:var(--color-primary)}
.msg{color:var(--color-text-secondary);margin:1rem 0 2rem}
a.back{display:inline-block;padding:.6rem 1.4rem;border-radius:8px;background:var(--color-primary);color:#fff;text-decoration:none}
a.back:hover{opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <p class="msg">页面不存在或已被移除</p>
  <a class="back" href="/">返回首页</a>
</div>
</body>
</html>
